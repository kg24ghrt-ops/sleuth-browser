name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Assemble the release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleuth-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: sleuth-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
